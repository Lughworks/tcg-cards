<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RIP & COLLECT • CardDex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at 20% 10%, #18181b 0%, #020617 60%, #000 100%);
            font-family: Inter, sans-serif;
            color: white;
        }

        .font-gta {
            font-family: 'Anton', sans-serif
        }

        .card {
            transform-style: preserve-3d;
            transition: all .35s ease;
        }

        .card:hover {
            transform: rotateX(8deg) rotateY(-8deg) scale(1.05);
        }

        .glare {
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0;
            transition: opacity .3s;
        }

        .card:hover .glare {
            opacity: 1;
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        #shinyToggle:checked+div+div {
            box-shadow: 0 0 8px #f97316;
        }
    </style>
</head>

<body class="selection:bg-orange-500 selection:text-black">
    <header class="border-b border-zinc-800 bg-black/70 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-orange-500 p-2 rounded">
                    <svg class="w-6 h-6 text-black" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" />
                    </svg>
                </div>
                <div>
                    <div class="font-gta text-2xl italic tracking-wide">
                        RIP & COLLECT
                    </div>
                    <div class="text-[10px] uppercase text-orange-400 tracking-[.25em]">
                        Series CardDex
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <input id="search" placeholder="Search..." class="bg-zinc-900 border border-zinc-700 px-3 py-1 rounded text-sm">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <span class="text-xs text-zinc-400">Shiny</span>
                    <div class="relative">
                        <input type="checkbox" id="shinyToggle" class="sr-only peer">
                        <div class="w-10 h-5 bg-zinc-700 rounded-full peer-checked:bg-orange-500 transition"></div>
                        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-5"></div>
                    </div>
                </label>
            </div>
        </div>
    </header>

    <nav class="max-w-7xl mx-auto px-4 mt-6 flex gap-2">
        <button onclick="switchTab('creatures')" class="tab px-4 py-1 border border-zinc-700 rounded text-xs uppercase">Creatures</button>
        <button onclick="switchTab('powers')" class="tab px-4 py-1 border border-zinc-700 rounded text-xs uppercase">Powers</button>
        <button onclick="switchTab('wiki')" class="tab px-4 py-1 border border-zinc-700 rounded text-xs uppercase">Wiki</button>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="content"></div>
    </main>

    <div id="viewer" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
        <div class="grid md:grid-cols-2 gap-10 max-w-5xl">
            <img id="viewerImg" class="rounded-xl shadow-2xl">
            <div id="viewerInfo" class="space-y-4 text-sm"></div>
        </div>
        <button onclick="closeViewer()" class="absolute top-10 right-10 bg-zinc-900 px-4 py-2 rounded">
            Close
        </button>
    </div>

    <script>
        let creatures = []
        let powers = []
        let elements = []
        let categories = []
        let energy = []
        let styles = []
        let tab = "creatures"
        let shiny = false

        const PATHS = {
            csv: {
                creatures: "csv/creatures.csv",
                powers: "csv/powers.csv",
                elements: "csv/elements.csv",
                categories: "csv/categories.csv",
                energy: "csv/energy.csv",
                styles: "csv/styles.csv"
            },
            cards: {
                creatures: "creatures_cards/",
                powers: "powers_cards/"
            },
            shiny: {
                creatures: "shiny/creatures_cards_shiny/",
                powers: "shiny/powers_cards_shiny/"
            },
            icons: {
                element: "icons/element/",
                energy: "icons/energy/",
                category: "icons/category/",
                styles: "icons/styles/"
            }
        }

        async function loadCSV(path) {
            const res = await fetch(path)
            const txt = await res.text()
            const lines = txt.trim().split("\n")
            const headers = lines[0].split(",")
            return lines.slice(1).map(line => {
                const cols = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
                const obj = {}
                headers.forEach((h, i) => {
                    obj[h.trim()] = cols[i] ? cols[i].replace(/^"|"$/g, "").trim() : ""
                })
                return obj
            })
        }

        async function init() {
            [
                creatures,
                powers,
                elements,
                categories,
                energy,
                styles
            ] = await Promise.all([
                loadCSV(PATHS.csv.creatures),
                loadCSV(PATHS.csv.powers),
                loadCSV(PATHS.csv.elements),
                loadCSV(PATHS.csv.categories),
                loadCSV(PATHS.csv.energy),
                loadCSV(PATHS.csv.styles)
            ])
            render()
        }

        function getSearch() {
            return document.getElementById("search").value.toLowerCase()
        }

        function switchTab(t) {
            tab = t
            render()
        }

        function render() {
            const el = document.getElementById("content")
            if (tab === "creatures") renderCreatures(el)
            if (tab === "powers") renderPowers(el)
            if (tab === "wiki") renderWiki(el)
        }

        function renderCreatures(el) {
            const q = getSearch()
            let list = creatures.filter(c =>
                c.name.toLowerCase().includes(q)
            )
            const folder = shiny ? PATHS.shiny.creatures : PATHS.cards.creatures
            el.innerHTML = `
            <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-6">
                ${list.map(c => cardHTML(folder + shinyFile(c.image_file), c)).join("")}
            </div>`
        }

        function renderPowers(el) {
            const q = getSearch()
            let list = powers.filter(p =>
                p.name.toLowerCase().includes(q)
            )
            const folder = shiny ? PATHS.shiny.powers : PATHS.cards.powers
            el.innerHTML = `
            <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-6">
               ${list.map(p => cardHTML(folder + shinyFile(p.image_file), p)).join("")}
            </div>`
        }

        function shinyFile(name) {
            if (!shiny) return name
            const parts = name.split(".")
            const ext = parts.pop()
            const base = parts.join(".")
            return base + "-s." + ext
        }

        function cardHTML(src, data) {
            return `
            <div class="card group cursor-pointer relative" onclick='openViewer("${src}", ${JSON.stringify(data)})'>
                <img loading="lazy" src="${src}" class="rounded-xl shadow-lg">
                <div class="glare absolute inset-0 rounded-xl"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/70 text-xs p-2 opacity-0 group-hover:opacity-100 transition">
                    <div class="font-bold">${data.name}</div>
                </div>
            </div>`
        }

        function renderWiki(el) {
            el.innerHTML = `<div class="space-y-10">
                ${wikiSection("Elements", elements, PATHS.icons.element)}
                ${wikiSection("Energy", energy, PATHS.icons.energy)}
                ${wikiSection("Categories", categories, PATHS.icons.category)}
                ${wikiSection("Styles", styles, PATHS.icons.styles)}
            </div>`
        }

        function wikiSection(title, data, folder) {
            return `
            <section>
                <h2 class="font-gta text-xl text-orange-400 mb-4 tracking-wide">
                    ${title}
                </h2>
                <div class="grid sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                    ${data.map(d => `
                        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-start gap-4 hover:border-orange-500/40 transition">
                            <img src="${folder}${d.icon_file}" class="w-12 h-12 object-contain shrink-0"> 
                            <div>
                                <div class="font-semibold text-sm mb-1">
                                    ${d.name}
                                </div>
                                <div class="text-xs text-zinc-400 leading-relaxed">
                                    ${d.description || ""}
                                </div>
                            </div>
                        </div>`).join("")}
                </div>
            </section>`
        }

        function openViewer(src, data) {
            document.getElementById("viewerImg").src = src
            let html = ""
            if (data.hp) {
                html += `
                <div class="text-2xl font-bold">${data.name}</div>
                <div class="text-orange-400">${data.element}</div>
                <div>HP: ${data.hp}</div>
                <div>Subtype: ${data.subtype}</div>
                <div>Weakness: ${data.weakness}</div>
                <div>Resistance: ${data.resistance}</div>
                <div>Retreat: ${data.retreat}</div>`
            }
            if (data.attack1_name) {
                html += `
                <div class="border-t border-zinc-800 pt-3">
                    <div class="font-semibold">${data.attack1_name}</div>
                    <div>Cost: ${data.attack1_cost}</div>
                    <div>Damage: ${data.attack1_damage}</div>
                    <div class="text-zinc-400">${data.attack1_text}</div>
                </div>`
            }
            if (data.attack2_name) {
                html += `
                <div>
                    <div class="font-semibold">${data.attack2_name}</div>
                    <div>Cost: ${data.attack2_cost}</div>
                    <div>Damage: ${data.attack2_damage}</div>
                    <div class="text-zinc-400">${data.attack2_text}</div>
                </div>`
            }
            document.getElementById("viewerInfo").innerHTML = html
            document.getElementById("viewer").classList.remove("hidden")
            document.getElementById("viewer").classList.add("flex")
        }

        function closeViewer() {
            document.getElementById("viewer").classList.add("hidden")
            document.getElementById("viewer").classList.remove("flex")
        }

        document.getElementById("search").addEventListener("input", render)
        document.getElementById("shinyToggle").addEventListener("change", e => {
            shiny = e.target.checked
            render()
        })

        init()
    </script>
</body>

</html>
